<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>try{var t=localStorage.getItem("paos.v2.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

      <a class="brand" href="index.html" aria-label="Polash AI OS home">

        <span class="brand-text"><b>Polash AI OS</b><small>Build · Learn · Earn · Grow</small></span>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
